services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.new
    restart: always
    volumes:
      - static-data:/vol/web
      - /home/ec2-user/data:/data
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      - postgres

  postgres:
    image: postgis/postgis
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # # CHANGED: Replaced the named volume with the absolute path to your EBS volume mount point
      # - /mnt/postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}

  proxy:
    build:
      context: ./proxy
    restart: always
    depends_on:
      - backend
    ports:
      - 80:8000
      - 443:8443
    volumes:
      - static-data:/vol/static

volumes:
  # CHANGED: Removed postgres-data from this section since it's now managed via the host file system directly
  postgres-data:
  static-data: